id: COMM-037
name: Default package index replaced or custom npm registry configured
description: >
  Detects --index-url in the install arguments of a server launched with
  uvx, pip or pipx, and --registry for npx / npm exec. Unlike
  --extra-index-url (COMM-036) these replace the default index rather than
  mixing two, so the exposure is the trustworthiness of the configured
  registry itself, not version rivalry between indexes — hence the lower
  severity. A custom index answers every package lookup, so its owner
  controls what the server executes. Both the separated and joined
  (--index-url=URL, --registry=URL) forms fire; the regex matches the flag
  itself, never the URL after it. Part of the dependency-confusion family
  documented in Alex Birsan's 2021 research.
severity: LOW
category: supply-chain
match:
  field: args
  pattern: '(?:^|\s)--(?:index-url|registry)\b'
  type: regex
message: >-
  Server '{server_name}' replaces the default package index or npm
  registry ({matched_value}) — verify the configured source is trusted
tags:
  - supply-chain
  - dependency-confusion
enabled: true
owasp_mcp_top_10:
  - MCP04
