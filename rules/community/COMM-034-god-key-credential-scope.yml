id: COMM-034
name: Overprivileged MCP server credential (potential god key)
description: >
  An env var key name in this server's configuration matches a pattern associated
  with broad-scope ("god key") credentials: admin, root, master, or superuser
  privilege tokens; Kubernetes cluster credentials; or org-scoped GitHub tokens.
  A god key turns any other finding in this scan from interesting to catastrophic —
  an attacker who reaches this server inherits the full permissions of this credential.

  Detection is fully offline via env var key name heuristics. No credential values
  are read. Conditions detected (in priority order):
  (1) Key names containing ADMIN, ROOT, MASTER, or SUPERUSER as an isolated segment
  (e.g. MY_ADMIN_KEY, ROOT_TOKEN, MASTER_SECRET, SUPERUSER_PASS) — highest-confidence
  god key signal across any cloud or on-prem platform.
  (2) Kubernetes cluster credentials (KUBE_TOKEN, KUBECONFIG, K8S_TOKEN,
  KUBERNETES_SERVICE_ACCOUNT_TOKEN) — any occurrence fires.
  (3) Org-scoped GitHub tokens (GITHUB_TOKEN, GH_TOKEN, GITHUB_PAT, GH_PAT) — fires
  on all occurrences; note that verified GitHub MCP servers legitimately require
  GITHUB_TOKEN. Treat condition-3 findings on known-registry servers as low-confidence
  until per-condition registry-exemption is implemented (COMM-034b follow-up).
  Condition 4 (AWS_ACCESS_KEY_ID co-occurring with 3+ AWS service name tokens in
  args) requires multi-key co-occurrence not natively supported by the rule engine;
  tracked as COMM-034b follow-up.

  Remediation: Replace broad-scope credentials with scoped alternatives. Use IAM
  policies or token scopes to restrict access to only the resources and actions this
  MCP server actually needs. Test with a read-only credential first.

  Reference: CIS Controls v8.1; CoSAI Zero Standing Privilege; Security Boulevard
  "Addressing the God Key Challenge" (March 2026); CoSAI RSAC 2026 Agentic IAM paper.
  CWE-250 (Execution with Unnecessary Privileges). OWASP MCP06.
severity: MEDIUM
category: credentials
match:
  operator: or
  conditions:
    - field: env
      # Matches any env var key where ADMIN, ROOT, MASTER, or SUPERUSER appears as
      # an isolated segment (preceded by non-alphanumeric character or start of key,
      # followed by underscore). E.g. MY_ADMIN_KEY, ROOT_TOKEN, MASTER_SECRET.
      # Case-insensitive lookbehind excludes false positives like ADMINISTRATOR_URL.
      # EVASION-KNOWN (intentional, see GAPS.md "Known detection evasions"):
      # MY_ADMIN (no trailing underscore) and XADMIN_KEY (alpha char before ADMIN)
      # do NOT fire. The leading-delimiter + trailing-underscore precision is a
      # deliberate FP tradeoff to avoid matching ADMINISTRATOR_* and similar.
      pattern: "(?i)(?<![A-Z0-9])(ADMIN|ROOT|MASTER|SUPERUSER)_"
      type: regex
    - field: env
      # Exact Kubernetes cluster credential env var names. Any occurrence is high
      # confidence — no legitimate non-Kubernetes usage exists for these names.
      pattern: "(?i)\\b(KUBE_TOKEN|KUBECONFIG|K8S_TOKEN|KUBERNETES_SERVICE_ACCOUNT_TOKEN)\\b"
      type: regex
    - field: env
      # Org-scoped GitHub token env var names. Fires on all servers including verified
      # GitHub MCP servers; treat as low-confidence on known-registry entries until
      # per-condition registry exemption is implemented (COMM-034b).
      pattern: "(?i)\\b(GITHUB_TOKEN|GH_TOKEN|GITHUB_PAT|GH_PAT)\\b"
      type: regex
message: >-
  Server '{server_name}' has an env var with a broad-scope credential pattern
  ('{matched_value}') — god key risk. A god key turns any other finding in this scan
  from interesting to catastrophic: an attacker who reaches this server inherits the
  full permissions of this credential. Scope this credential to only the operations
  this server requires. Reference: CIS Controls v8.1; CoSAI Zero Standing Privilege;
  Security Boulevard "Addressing the God Key Challenge" (March 2026).
tags:
  - credentials
  - god-key
  - least-privilege
  - cwe-250
enabled: true
owasp_mcp_top_10:
  - MCP06
cve: []
