# mcp-audit diff — PR comment workflow
#
# On every pull request this workflow:
#   1. Scans the BASE commit and saves results to base.json.
#   2. Scans the HEAD commit and saves results to head.json.
#   3. Runs `mcp-audit diff base.json head.json --format pr-comment` to produce
#      a concise GitHub-flavored Markdown summary of what changed in MCP terms:
#      added/removed/changed servers, tools, capabilities, env-var references,
#      endpoints, and credentials — each with a severity classification.
#   4. Posts the Markdown as a comment on the PR conversation tab via
#      `actions/github-script`, so reviewers see MCP security context without
#      leaving the PR.
#
# Exit behaviour:
#   - The diff step uses `continue-on-error: true` so the comment is always
#     posted even when the diff finds changes above the threshold.
#   - A separate "Fail on findings" step re-reads the diff exit code and fails
#     the check explicitly, giving you a clean separation of "post comment" and
#     "gate the PR" logic.
#
# Required permissions:
#   - contents: read  — to check out the repo and resolve git refs
#   - pull-requests: write  — to post the PR comment
#
# Alternative: for a one-step setup (no separate scan stages), use
# `examples/github-actions/diff-mode.yml` which uses `mode: diff` inside the
# mcp-audit composite action.

name: MCP Diff (PR Comment)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  mcp-diff:
    runs-on: ubuntu-latest

    steps:
      # Fetch full history so base and head SHAs are always reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install the mcp-audit binary from GitHub Releases (cached by version+OS).
      - name: Install mcp-audit
        uses: adudley78/setup-mcp-audit@v1
        with:
          version: 'latest'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Scan the base commit.  `|| true` prevents a non-zero scan exit code
      # (findings present) from aborting the workflow before the diff runs.
      - name: Scan base commit
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          mcp-audit scan --format json -o base.json || true

      # Return to the PR head and scan it.
      - name: Scan head commit
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          mcp-audit scan --format json -o head.json || true

      # Produce the PR comment Markdown.  `continue-on-error: true` ensures
      # the comment is posted even when the diff finds HIGH/CRITICAL changes
      # (exit 1).  The exit code is captured for the gate step below.
      - name: Generate MCP diff
        id: mcp_diff
        continue-on-error: true
        run: |
          mcp-audit diff base.json head.json \
            --format pr-comment \
            --severity-threshold medium \
            > diff-output.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Post the Markdown as a PR comment.
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('diff-output.md', 'utf8');
            if (!body.trim()) {
              console.log('diff-output.md is empty — skipping comment');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Fail the check if the diff found changes at or above the threshold.
      # Adjust `severity-threshold` above (or remove this step) to lighten the
      # gate — e.g. use `high` to allow MEDIUM changes without blocking the PR.
      - name: Fail on MCP changes above threshold
        if: steps.mcp_diff.outcome == 'failure'
        run: |
          echo "::error::mcp-audit diff found MCP changes at or above the severity threshold."
          exit 1
