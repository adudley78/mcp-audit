# Minimal mcp-audit setup — scan and upload SARIF, no threshold enforcement.
# Findings appear in the GitHub Security tab but the build never fails.
# Good for: initial adoption, visibility-only mode, repos with existing findings.
#
# The scanner action downloads the pre-built binary via setup-action/action.yml
# and caches it by version + OS — subsequent runs with the same version tag
# complete the install step in under 1 second.

name: MCP Security Scan (Basic)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  mcp-audit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run mcp-audit
        uses: adudley78/mcp-audit@32b648a33a7549e459c1a8bc42ba121079b11eca # v0.10.0
        with:
          severity-threshold: info   # report everything; never fails the build
          fail-on-findings: 'false'  # explicit: convert exit 1 into step success
          upload-sarif: 'true'
