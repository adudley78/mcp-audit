# Minimal Credenzo pre-commit integration.
# Fires whenever a JSON file is staged; fails the commit if any HIGH or
# CRITICAL findings are detected in your MCP server configurations.
#
# `rev` is pinned to the current release and updated by each release PR.
# Later releases: https://github.com/adudley78/credenzo/releases
repos:
  - repo: https://github.com/adudley78/credenzo
    rev: v0.35.0  # current release; `pre-commit autoupdate` moves it forward
    hooks:
      - id: credenzo
