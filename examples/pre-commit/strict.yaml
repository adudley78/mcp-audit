# Strict Credenzo pre-commit integration.
# Fails the commit if any MEDIUM, HIGH, or CRITICAL findings are detected
# in your MCP server configurations.
#
# `rev` is pinned to the current release and updated by each release PR.
# Later releases: https://github.com/adudley78/credenzo/releases
repos:
  - repo: https://github.com/adudley78/credenzo
    rev: v0.36.0  # current release; `pre-commit autoupdate` moves it forward
    hooks:
      - id: credenzo
        args: [scan, --severity-threshold, medium]
