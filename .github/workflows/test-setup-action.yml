name: Test setup-mcp-audit action

# Verifies that setup-action/action.yml correctly downloads the mcp-audit
# binary and puts it on PATH across all three supported OS targets.
#
# Two job groups:
#   test-latest  — installs the latest release; validates `mcp-audit version`
#   test-pinned  — installs a specific tag; validates `mcp-audit version`

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Latest version ────────────────────────────────────────────────────────
  test-latest:
    name: latest / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mcp-audit (latest)
        id: setup
        uses: ./setup-action
        with:
          version: 'latest'

      - name: Verify binary is on PATH
        shell: bash
        run: mcp-audit version

      - name: Print resolved version output
        shell: bash
        run: echo "Resolved version = ${{ steps.setup.outputs.mcp-audit-version }}"

  # ── Pinned version ────────────────────────────────────────────────────────
  test-pinned:
    name: pinned v0.9.0 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mcp-audit (pinned)
        id: setup
        uses: ./setup-action
        with:
          version: 'v0.9.0'

      - name: Verify binary is on PATH
        shell: bash
        run: mcp-audit version

      - name: Confirm pinned version is installed
        shell: bash
        run: |
          OUTPUT=$(mcp-audit version 2>&1)
          if echo "$OUTPUT" | grep -q "0.9"; then
            echo "Version check passed: $OUTPUT"
          else
            echo "::warning::Version output did not contain '0.9': $OUTPUT"
          fi

  # ── Scanner action still works after the setup-action refactor ────────────
  test-scanner-action:
    name: scanner action smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run scanner action (uses setup-action internally)
        uses: ./
        with:
          config-paths: 'demo/configs/'
          severity-threshold: 'critical'
          fail-on-findings: 'false'
          upload-sarif: 'false'
