name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Install Playwright browsers
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv pip install playwright --system
          python -m playwright install chromium firefox webkit
          python -m playwright install-deps

      - name: Run tests
        run: pytest tests/ -x -q

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  test-all-extras:
    name: Test all optional extras (ubuntu, 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install all optional extras
        # The default `test` matrix only installs `[dev]`, so anything gated
        # on `cyclonedx-python-lib`, `sigstore`, `mcp`, or `httpx` would
        # silently skip (nine SBOM tests plus the attestation / live-MCP
        # paths).  This job wires the full optional stack so those code
        # paths are actually exercised on every PR.
        run: uv pip install -e ".[dev,sbom,attestation,mcp]" --system

      - name: Run tests
        run: pytest tests/ -x -q

      - name: Verify test-count docs in sync
        # Runs in this job (all optional extras installed) so the collected
        # count matches the full 1,391-test baseline written into the docs.
        # The script uses sys.executable so it queries the same environment
        # that just ran the tests, not a fresh uv venv.
        run: python scripts/update_test_count.py --check

      - name: Verify OWASP mapping completeness
        # Ensures every finding ID in src/ has an entry in docs/owasp-mapping.json.
        # A PR that adds a new finding ID without updating the mapping will fail here.
        run: python scripts/validate_owasp_mapping.py

  wheel-check:
    name: Wheel metadata
    runs-on: ubuntu-latest
    # The Core-Metadata invariant: hatchling's emitted Metadata-Version must
    # be one the publish action's bundled Twine accepts. v0.15.0 failed at
    # the tag because hatchling floated to 2.5 while the action still had
    # Twine 6. Do not pin hatchling in lockstep with the action — this
    # check is the invariant and runs on every PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # uv is deliberately unpinned. Downstream (CPython 3.12.14, uv.lock,
        # four-platform PYZ inspect) is pinned and checked; an incompatible
        # uv fails the build immediately. latest-known was tried 2026-08-22
        # and resolved uv 0.12.4, which cannot fetch 3.12.14. Do not pin a
        # uv version — Dependabot does not bump action input strings.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        # Same interpreter as publish-pypi. Pin owned by the binary composite
        # default; pytest asserts this copy matches.
        run: uv python install 3.12.14

      - name: Build wheel and twine-check
        # Resolve Twine from the publish action's runtime.txt at the pinned
        # SHA — not a copy in this file. Dependabot bumping the action SHA
        # then gets the matching Twine on the next PR, not a silent desync.
        # Parse with sed, not awk -F=: a double-equals pin leaves an empty field.
        run: |
          set -euo pipefail
          SHA=$(grep -oE 'pypa/gh-action-pypi-publish@[0-9a-f]{40}' \
            .github/workflows/release.yml | head -n1 | cut -d@ -f2)
          if ! echo "$SHA" | grep -qxE '[0-9a-f]{40}'; then
            echo "ERROR: could not parse publish action SHA from release.yml" >&2
            exit 1
          fi
          RUNTIME_URL="https://raw.githubusercontent.com/pypa/gh-action-pypi-publish/${SHA}/requirements/runtime.txt"
          echo "Fetching $RUNTIME_URL"
          RUNTIME=$(curl -fsSL "$RUNTIME_URL")
          TWINE=$(printf '%s\n' "$RUNTIME" | sed -n 's/^twine==//p' | head -n1)
          if [ -z "$TWINE" ]; then
            echo "ERROR: no twine== pin in runtime.txt at $SHA" >&2
            printf '%s\n' "$RUNTIME" | head -n20 >&2
            exit 1
          fi
          echo "Publish action $SHA bundles twine==$TWINE"
          uv build --wheel
          uvx "twine==${TWINE}" check --strict dist/*.whl
          chmod +x scripts/generate_wheel_sbom.sh
          export UV_PYTHON=3.12.14
          scripts/generate_wheel_sbom.sh \
            dist/*.whl \
            dist/mcp-audit-scanner-wheel.cdx.json

  binary-smoke:
    name: Binary smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Only run on PRs and pushes to main — skip for every branch push.
    # Four legs match release.yml so CI tests the artifact users download,
    # not a linux-only subset. fail-fast is false: one platform must not
    # hide a spec/exclude failure on another.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in lockstep with .github/workflows/release.yml `build.matrix`.
          # macos-13 was retired 2025-12-08; macos-15-intel is the x86_64
          # replacement through 2027-08.
          - os: macos-15-intel
            target: darwin-x86_64
            spec: mcp-audit-darwin-x86_64.spec
            binary: mcp-audit-darwin-x86_64
          - os: macos-latest
            target: darwin-arm64
            spec: mcp-audit-darwin-arm64.spec
            binary: mcp-audit-darwin-arm64
          - os: ubuntu-latest
            target: linux-x86_64
            spec: mcp-audit-linux-x86_64.spec
            binary: mcp-audit-linux-x86_64
          - os: windows-latest
            target: windows-x86_64
            spec: mcp-audit-windows-x86_64.spec
            binary: mcp-audit-windows-x86_64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Interpreter, extras, spec, PyInstaller, PYZ inspect, smoke, size:
      # one definition, shared with release.yml. Do not inline a copy here.
      - uses: ./.github/actions/build-binary
        with:
          spec: ${{ matrix.spec }}
          binary: ${{ matrix.binary }}
          target: ${{ matrix.target }}

  source-smoke:
    name: Source smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Only run on PRs and pushes to main — skip for every branch push.
    # Binary smoke now covers all four release targets. This job still adds
    # watcher/rug-pull/canonical-path coverage on source installs without a
    # second PyInstaller build.
    # canonical-path coverage on both Ubuntu and Windows without the cost of a
    # PyInstaller build.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run source smoke test
        # Pass "uv run mcp-audit" as the multi-word binary invocation so the
        # smoke test uses the installed source package rather than a built binary.
        # On Windows the entry-point script may not be on PATH after --system
        # install; "uv run" resolves the entry point reliably on all platforms.
        run: python scripts/smoke_test.py uv run mcp-audit
