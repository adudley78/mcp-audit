name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Install Playwright browsers
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv pip install playwright --system
          python -m playwright install chromium firefox webkit
          python -m playwright install-deps

      - name: Run tests
        run: pytest tests/ -x -q

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  test-all-extras:
    name: Test all optional extras (ubuntu, 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install all optional extras
        # The default `test` matrix only installs `[dev]`, so anything gated
        # on `cyclonedx-python-lib`, `sigstore`, `mcp`, or `httpx` would
        # silently skip (nine SBOM tests plus the attestation / live-MCP
        # paths).  This job wires the full optional stack so those code
        # paths are actually exercised on every PR.
        run: uv pip install -e ".[dev,sbom,attestation,mcp]" --system

      - name: Run tests
        run: pytest tests/ -x -q

      - name: Verify test-count docs in sync
        # Runs in this job (all optional extras installed) so the collected
        # count matches the full 1,391-test baseline written into the docs.
        # The script uses sys.executable so it queries the same environment
        # that just ran the tests, not a fresh uv venv.
        run: python scripts/update_test_count.py --check

      - name: Verify OWASP mapping completeness
        # Ensures every finding ID in src/ has an entry in docs/owasp-mapping.json.
        # A PR that adds a new finding ID without updating the mapping will fail here.
        run: python scripts/validate_owasp_mapping.py

  binary-smoke:
    name: Binary smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Only run on PRs and pushes to main — skip for every branch push.
    # Four legs match release.yml so CI tests the artifact users download,
    # not a linux-only subset. fail-fast is false: one platform must not
    # hide a spec/exclude failure on another.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in lockstep with .github/workflows/release.yml `build.matrix`.
          # macos-13 was retired 2025-12-08; macos-15-intel is the x86_64
          # replacement through 2027-08.
          - os: macos-15-intel
            target: darwin-x86_64
            spec: mcp-audit-darwin-x86_64.spec
            binary: mcp-audit-darwin-x86_64
          - os: macos-latest
            target: darwin-arm64
            spec: mcp-audit-darwin-arm64.spec
            binary: mcp-audit-darwin-arm64
          - os: ubuntu-latest
            target: linux-x86_64
            spec: mcp-audit-linux-x86_64.spec
            binary: mcp-audit-linux-x86_64
          - os: windows-latest
            target: windows-x86_64
            spec: mcp-audit-windows-x86_64.spec
            binary: mcp-audit-windows-x86_64.exe

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # Match release.yml: extras land in the venv so the spec's
        # `excludes=` list is actually exercised.  Installing `[dev]` only
        # never tests that sigstore (and any other excluded extra) stays out
        # of the binary when those packages are present in the build env.
        # Optional extras that the spec does *not* exclude will be frozen
        # in — the same as the artifact users download from GitHub Releases.
        run: uv sync --all-extras

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build binary
        run: uv run pyinstaller ${{ matrix.spec }} --distpath dist/

      - name: Inspect frozen archive
        # Opens the PKG/PYZ inside the built binary (not the spec). Fails if
        # a spec exclude leaked in, or if PIL/cryptography were stripped.
        # `--connect` hint is asserted only when `mcp` is absent from the PYZ.
        shell: bash
        run: uv run python scripts/inspect_frozen_binary.py dist/${{ matrix.binary }} ${{ matrix.spec }}

      - name: Run smoke test
        # `uv run python` pins the interpreter to the uv-managed .venv, matching
        # release.yml, so the step does not depend on whatever `python` is on PATH.
        shell: bash
        run: uv run python scripts/smoke_test.py dist/${{ matrix.binary }}

      - name: Check binary size
        shell: bash
        run: |
          BINARY="dist/${{ matrix.binary }}"
          SIZE_BYTES=$(wc -c < "$BINARY" | tr -d ' ')
          # `bc` is not installed in Windows' Git Bash; awk is on every runner.
          SIZE_MB=$(awk -v b="$SIZE_BYTES" 'BEGIN { printf "%.1f", b/1048576 }')
          echo "Binary size: ${SIZE_MB} MB (${SIZE_BYTES} bytes) target=${{ matrix.target }}"
          if [ "$SIZE_BYTES" -gt 52428800 ]; then
            echo "ERROR: binary exceeds 50 MB hard limit (${SIZE_MB} MB)" >&2
            exit 1
          elif [ "$SIZE_BYTES" -gt 41943040 ]; then
            echo "WARNING: binary exceeds 40 MB soft limit (${SIZE_MB} MB)"
          else
            echo "OK: binary is within size target"
          fi

  source-smoke:
    name: Source smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Only run on PRs and pushes to main — skip for every branch push.
    # Binary smoke now covers all four release targets. This job still adds
    # watcher/rug-pull/canonical-path coverage on source installs without a
    # second PyInstaller build.
    # canonical-path coverage on both Ubuntu and Windows without the cost of a
    # PyInstaller build.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run source smoke test
        # Pass "uv run mcp-audit" as the multi-word binary invocation so the
        # smoke test uses the installed source package rather than a built binary.
        # On Windows the entry-point script may not be on PATH after --system
        # install; "uv run" resolves the entry point reliably on all platforms.
        run: python scripts/smoke_test.py uv run mcp-audit
