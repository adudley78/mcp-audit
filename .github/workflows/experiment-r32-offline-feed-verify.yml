# One-off proof for R32 Part 4: does `mcp-audit feed verify` actually verify the
# REAL, live-signed advisory feed with genuinely zero network egress?
#
# workflow_dispatch only. Never runs on a schedule. Touches no secrets — feed
# verification only needs the public key already committed at
# keys/mcp-audit-feed.pub, never the private signing key. This mirrors the
# `unshare --net` methodology docs/offline-verification-findings.md used for
# R27 (cosign keyless), applied here to the minisign key-mode path the feed
# actually uses. Safe to delete once its run has been captured in a report —
# it proves a fact about the pipeline, it does not maintain one.
name: "Experiment (R32): offline verify of the real feed"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install mcp-audit
        run: uv pip install -e ".[dev]" --system

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Fetch the REAL published feed and its committed public key (network — while we still have it)
        run: |
          mkdir -p /tmp/prod_feed
          git clone --depth 1 --branch feed https://github.com/adudley78/mcp-audit.git /tmp/prod_feed
          rm -rf /tmp/prod_feed/.git
          cp keys/mcp-audit-feed.pub /tmp/prod_feed.pub
          echo "--- fetched tree ---"
          find /tmp/prod_feed -maxdepth 2 -type f | sort
          echo "--- index.json.sig present at top level? ---"
          ls -la /tmp/prod_feed/index.json.sig 2>&1 || echo "MISSING: /tmp/prod_feed/index.json.sig"

      - name: Confirm the namespace has genuinely zero network egress
        run: |
          curl --max-time 5 -sS -o /dev/null -w 'outside namespace: HTTP %{http_code}\n' https://1.1.1.1 || true
          sudo unshare --net -- curl --max-time 5 -sS -o /dev/null -w 'inside namespace: HTTP %{http_code}\n' https://1.1.1.1 \
            && echo "UNEXPECTED: curl succeeded inside the namespace" \
            || echo "EXPECTED: curl failed inside the namespace (no route)"

      - name: "Pass case: verify the real feed offline"
        run: |
          echo "::group::mcp-audit feed verify (real production bytes, unshare --net)"
          sudo --preserve-env=PATH,HOME unshare --net -- \
            mcp-audit feed verify /tmp/prod_feed --key-alt minisign --public-key /tmp/prod_feed.pub
          echo "EXIT CODE: $?"
          echo "::endgroup::"

      - name: "Tamper case: flip one byte of a downloaded advisory, still offline"
        run: |
          cp -r /tmp/prod_feed /tmp/prod_feed_tampered
          ADV=$(ls /tmp/prod_feed_tampered/advisories/*.json | grep -v '\.sig$' | head -1)
          echo "Tampering with: $ADV"
          python3 - "$ADV" <<'PY'
          import sys
          path = sys.argv[1]
          data = bytearray(open(path, "rb").read())
          # Flip one bit in the middle of the file -- content changes, digest changes.
          mid = len(data) // 2
          data[mid] ^= 0x01
          open(path, "wb").write(data)
          PY
          echo "::group::mcp-audit feed verify (tampered advisory, unshare --net) -- expected to FAIL"
          set +e
          sudo --preserve-env=PATH,HOME unshare --net -- \
            mcp-audit feed verify /tmp/prod_feed_tampered --key-alt minisign --public-key /tmp/prod_feed.pub
          RC=$?
          set -e
          echo "EXIT CODE: $RC"
          if [ "$RC" -eq 0 ]; then
            echo "::error::Tampered feed verified as OK -- this must fail."
            exit 1
          fi
          echo "Correctly detected as invalid (non-zero exit)."
          echo "::endgroup::"
