# R27 — empirical test: can a Sigstore-signed artifact be verified with
# NO network access?
#
# This is a one-off experiment, not product infrastructure. It signs a
# throwaway file with known contents using the exact keyless flow the
# advisory-feed signing decision proposes (ambient GitHub Actions OIDC,
# Fulcio cert, Rekor entry), then verifies it in a network namespace with
# no interfaces at all (`unshare --net`, equivalent to `docker run
# --network none`). It signs nothing real and never runs on a schedule.
#
# See docs/offline-verification-findings.md for the write-up and
# humans/decisions/2026-08-20-signing-key-custody.md (in the marcus repo)
# for the decision this experiment tests.
#
# Manual only. Never remove workflow_dispatch-only triggering from this file.

name: "Experiment (R27): offline Sigstore verification"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Sign a throwaway artifact (keyless, ambient OIDC)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (bundles cosign v3.0.6)

      - name: Record cosign version
        run: |
          cosign version | tee cosign-version.json

      - name: Create throwaway artifact with known contents
        run: |
          mkdir -p artifact
          {
            echo "mcp-audit R27 offline-verification experiment"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
          } > artifact/artifact.txt
          sha256sum artifact/artifact.txt

      - name: Sign artifact (keyless sign-blob, bundle written alongside)
        working-directory: artifact
        run: |
          cosign sign-blob --yes --bundle artifact.sigstore.json artifact.txt
          echo "--- bundle (truncated) ---"
          head -c 2000 artifact.sigstore.json
          echo

      - name: Decode the Fulcio cert SAN and issuer for the record
        working-directory: artifact
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64, json
          bundle = json.load(open("artifact.sigstore.json"))
          cert_der_b64 = bundle["verificationMaterial"]["certificate"]["rawBytes"]
          with open("leaf.der", "wb") as f:
              f.write(base64.b64decode(cert_der_b64))
          PY
          openssl x509 -in leaf.der -inform der -noout -ext subjectAltName -ext 1.3.6.1.4.1.57264.1.8 -ext 1.3.6.1.4.1.57264.1.9 2>&1 || true

      - name: Upload artifact + bundle for the offline-verification job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r27-artifact-and-bundle
          path: |
            artifact/artifact.txt
            artifact/artifact.sigstore.json
            cosign-version.json
          retention-days: 14
          if-no-files-found: error

  verify-offline:
    name: Verify with network namespace isolated (unshare --net)
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign (same version as the signing job)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (bundles cosign v3.0.6)

      - name: Resolve absolute cosign path (sudo resets PATH; unshare needs the literal path)
        id: cosign_bin
        run: |
          echo "path=$(command -v cosign)" >> "$GITHUB_OUTPUT"
          command -v cosign

      - name: Download artifact + bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r27-artifact-and-bundle
          path: .

      - name: Compute expected Fulcio identity from this workflow's own ref
        id: identity
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          echo "identity=https://github.com/${WORKFLOW_REF}" >> "$GITHUB_OUTPUT"
          echo "issuer=https://token.actions.githubusercontent.com" >> "$GITHUB_OUTPUT"
          echo "Computed identity: https://github.com/${WORKFLOW_REF}"

      - name: CONTROL — confirm network works outside the namespace
        run: |
          curl --max-time 5 -sS -o /dev/null -w '%{http_code}\n' https://1.1.1.1 \
            && echo "control: network reachable outside unshare, as expected" \
            || (echo "control FAILED: expected network to be reachable here" && exit 1)

      - name: CONTROL — confirm unshare --net truly blocks all egress
        run: |
          set +e
          sudo unshare --net -- \
            curl --max-time 5 -sS -o /dev/null -w '%{http_code}\n' https://1.1.1.1
          code=$?
          set -e
          echo "exit code inside netns: $code"
          if [ "$code" -eq 0 ]; then
            echo "control FAILED: curl succeeded inside an isolated network namespace"
            exit 1
          fi
          echo "control OK: no route to any address inside the namespace"

      - name: TEST 1 — fresh cosign, no cached trust root, network off
        run: |
          set +e
          rm -rf "$HOME/.sigstore"
          timeout 30 sudo --preserve-env=HOME unshare --net -- \
            "${{ steps.cosign_bin.outputs.path }}" verify-blob \
              --bundle artifact.sigstore.json \
              --certificate-identity "${{ steps.identity.outputs.identity }}" \
              --certificate-oidc-issuer "${{ steps.identity.outputs.issuer }}" \
              artifact.txt
          echo "TEST1_EXIT=$?" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pre-fetch the TUF trust root (network ON, one time, documented step)
        run: |
          rm -rf "$HOME/.sigstore"
          cosign initialize
          find "$HOME/.sigstore" -type f | sort
          cp "$HOME"/.sigstore/root/*/targets/trusted_root.json ./standalone_trusted_root.json
          python3 -c "
          import json
          for name in ['root.json', 'timestamp.json', 'snapshot.json', 'targets.json']:
              import glob
              path = glob.glob(f'$HOME/.sigstore/root/*/{name}')[0]
              doc = json.load(open(path))
              print(name, 'expires:', doc['signed']['expires'])
          "

      - name: TEST 2 — cached trust root, network off, HAPPY PATH
        run: |
          set +e
          timeout 30 sudo --preserve-env=HOME unshare --net -- \
            "${{ steps.cosign_bin.outputs.path }}" verify-blob \
              --bundle artifact.sigstore.json \
              --certificate-identity "${{ steps.identity.outputs.identity }}" \
              --certificate-oidc-issuer "${{ steps.identity.outputs.issuer }}" \
              artifact.txt
          echo "TEST2_EXIT=$?" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: TEST 3 — cached trust root, network off, TAMPERED artifact
        run: |
          set +e
          cp artifact.txt artifact.tampered.txt
          python3 -c "
          data = bytearray(open('artifact.tampered.txt', 'rb').read())
          data[0] ^= 0xFF
          open('artifact.tampered.txt', 'wb').write(bytes(data))
          "
          timeout 30 sudo --preserve-env=HOME unshare --net -- \
            "${{ steps.cosign_bin.outputs.path }}" verify-blob \
              --bundle artifact.sigstore.json \
              --certificate-identity "${{ steps.identity.outputs.identity }}" \
              --certificate-oidc-issuer "${{ steps.identity.outputs.issuer }}" \
              artifact.tampered.txt
          code=$?
          echo "TEST3_EXIT=$code" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            echo "TEST 3 FAILED THE EXPERIMENT: tampered artifact verified successfully"
            exit 1
          fi

      - name: TEST 4 — cached trust root, network off, WRONG identity
        run: |
          set +e
          timeout 30 sudo --preserve-env=HOME unshare --net -- \
            "${{ steps.cosign_bin.outputs.path }}" verify-blob \
              --bundle artifact.sigstore.json \
              --certificate-identity "https://github.com/someone-else/not-this-repo/.github/workflows/other.yml@refs/heads/main" \
              --certificate-oidc-issuer "${{ steps.identity.outputs.issuer }}" \
              artifact.txt
          code=$?
          echo "TEST4_EXIT=$code" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            echo "TEST 4 FAILED THE EXPERIMENT: wrong identity verified successfully"
            exit 1
          fi

      - name: TEST 5 — explicit --trusted-root FILE, TUF cache deleted, network off
        run: |
          set +e
          rm -rf "$HOME/.sigstore"
          timeout 30 sudo --preserve-env=HOME unshare --net -- \
            "${{ steps.cosign_bin.outputs.path }}" verify-blob \
              --bundle artifact.sigstore.json \
              --trusted-root standalone_trusted_root.json \
              --certificate-identity "${{ steps.identity.outputs.identity }}" \
              --certificate-oidc-issuer "${{ steps.identity.outputs.issuer }}" \
              artifact.txt
          echo "TEST5_EXIT=$?" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: TEST 6 — cached trust root aged past its own expiry, network off
        run: |
          set +e
          rm -rf "$HOME/.sigstore"
          cosign initialize
          EXPIRES=$(python3 -c "
          import json, glob
          path = glob.glob('$HOME/.sigstore/root/*/timestamp.json')[0]
          print(json.load(open(path))['signed']['expires'])
          ")
          echo "timestamp.json expires at: $EXPIRES"
          FUTURE=$(python3 -c "
          import datetime
          d = datetime.datetime.strptime('$EXPIRES', '%Y-%m-%dT%H:%M:%SZ')
          d = d + datetime.timedelta(days=3)
          print(d.strftime('%Y-%m-%d %H:%M:%S'))
          ")
          echo "setting system clock to (past timestamp.json expiry): $FUTURE UTC"
          sudo systemctl stop systemd-timesyncd 2>/dev/null || true
          sudo timedatectl set-ntp false 2>/dev/null || true
          sudo date -u -s "$FUTURE"
          date -u
          timeout 30 sudo --preserve-env=HOME unshare --net -- \
            "${{ steps.cosign_bin.outputs.path }}" verify-blob \
              --bundle artifact.sigstore.json \
              --certificate-identity "${{ steps.identity.outputs.identity }}" \
              --certificate-oidc-issuer "${{ steps.identity.outputs.issuer }}" \
              artifact.txt
          echo "TEST6_EXIT=$?" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: TEST 7 — same aged clock, but explicit --trusted-root FILE
        run: |
          set +e
          date -u
          timeout 30 sudo --preserve-env=HOME unshare --net -- \
            "${{ steps.cosign_bin.outputs.path }}" verify-blob \
              --bundle artifact.sigstore.json \
              --trusted-root standalone_trusted_root.json \
              --certificate-identity "${{ steps.identity.outputs.identity }}" \
              --certificate-oidc-issuer "${{ steps.identity.outputs.issuer }}" \
              artifact.txt
          echo "TEST7_EXIT=$?" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore clock (best-effort; runner is thrown away regardless)
        if: always()
        run: sudo timedatectl set-ntp true 2>/dev/null || true
