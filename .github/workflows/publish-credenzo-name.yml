name: Publish the credenzo name to PyPI

# Manual, one job per run. Publishes packaging/credenzo/ (a package with no
# code that depends on mcp-audit-scanner) so that `pip install credenzo`
# works and the name belongs to this project. PyPI refuses a version twice,
# so a second run fails until packaging/credenzo/pyproject.toml is bumped.
# Same split as release.yml: the build never runs next to `id-token: write`.
on:
  workflow_dispatch:

permissions: {}

concurrency: publish-credenzo-name

jobs:
  build-dist:
    name: Build credenzo sdist + wheel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: false

      - name: Build
        run: uv build packaging/credenzo --out-dir dist/

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credenzo-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish credenzo to PyPI
    needs: build-dist
    runs-on: ubuntu-latest
    environment:
      name: pypi-credenzo
      url: https://pypi.org/p/credenzo
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: credenzo-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
