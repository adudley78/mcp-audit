version: 2
updates:
  # Python dependencies (pip/uv)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release (version updates only;
    # security updates are not delayed). Most 2026 registry worms
    # (Shai-Hulud, TanStack, IronWorm) were caught and pulled within hours
    # to days; a cooldown keeps them out of our lockfile.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      # sigstore has breaking changes between minors — pin manually
      - dependency-name: sigstore
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # watchdog 7 hangs the test suite on Windows (#274: both Windows legs
      # ran to the 6-hour limit twice; Linux and macOS pass). Hold at <7
      # until the Windows hang is understood.
      - dependency-name: watchdog
        update-types: ["version-update:semver-major"]
    # Version updates only bump packages named in pyproject.toml. Transitives
    # that exist only in uv.lock (pillow via reportlab, pyasn1 via sigstore)
    # generate Dependabot *alerts* but no version-update PRs. Repo-level
    # security updates do open PRs for lockfile CVEs, but without grouping
    # each CVE is its own PR and they stall behind the open-PR limit — that
    # is how 33 alerts accumulated while version-update PRs kept merging.
    # Group them; do not raise the limit.
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  # `/` covers `.github/workflows/` and a root `action.yml` only — not
  # composites. #60's setup-uv bump inside `.github/actions/build-binary/`
  # had to be applied by hand because of that. `/.github/actions/*` is a
  # single-level glob (not `**`; that duplicates PRs). `/setup-action` is
  # the other composite; it pins `actions/cache`, which no workflow uses.
  # `group-by: dependency-name` keeps one PR per action across directories
  # instead of a workflow PR and a composite PR for the same SHA.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
      - "/setup-action"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release (version updates only;
    # security updates are not delayed). Most 2026 registry worms
    # (Shai-Hulud, TanStack, IronWorm) were caught and pulled within hours
    # to days; a cooldown keeps them out of our lockfile.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # init/autobuild/analyze/upload-sarif are one release and
      # tests/test_action_yaml.py requires one SHA across them. Under
      # group-by: dependency-name each sub-action got its own PR, and each
      # failed that test alone (#275, #277-#279). The first matching group
      # wins, so this one must stay above github-actions.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      github-actions:
        patterns:
          - "*"
        group-by: dependency-name
