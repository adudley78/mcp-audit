rules:
  - id: mcp-ts-hardcoded-api-key
    message: >
      Hardcoded credential in TypeScript MCP server. API keys, secrets, tokens,
      and passwords must not be embedded in source code — use environment
      variables (process.env.MY_API_KEY) or a secrets manager instead.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded credential in TypeScript MCP server
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
    patterns:
      - pattern: const $VAR = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(api_?key|access_?key|secret_?key|secret|token|password|passwd|auth_?token|private_?key)
      - metavariable-regex:
          metavariable: $VALUE
          regex: .{20,}

  - id: mcp-ts-hardcoded-api-key-let
    message: >
      Hardcoded credential in TypeScript MCP server. API keys, secrets, tokens,
      and passwords must not be embedded in source code — use environment
      variables (process.env.MY_API_KEY) instead.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded credential (let/var) in TypeScript MCP server
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
    patterns:
      - pattern: let $VAR = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(api_?key|access_?key|secret_?key|secret|token|password|passwd|auth_?token|private_?key)
      - metavariable-regex:
          metavariable: $VALUE
          regex: .{20,}

  - id: mcp-ts-gcp-service-account-key
    message: >
      GCP service account private key detected. Service account JSON keys must
      not be hardcoded — use Workload Identity Federation or inject via a
      secrets manager at runtime.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded GCP service account private key
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
    pattern-regex: '"private_key"\s*:\s*"-----BEGIN'

  - id: mcp-ts-azure-sas-token
    message: >
      Azure SAS token with signature detected. SAS tokens grant delegated access
      to Azure Storage and must not be hardcoded — use managed identities or
      inject tokens at runtime from a secrets manager.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded Azure SAS token
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    pattern-regex: sv=\d{4}-\d{2}-\d{2}[^\s"']{0,200}&sig=[A-Za-z0-9+/=]+

  - id: mcp-ts-digitalocean-token
    message: >
      DigitalOcean personal access token detected. API tokens must not be
      hardcoded — use environment variables or a secrets manager.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded DigitalOcean personal access token
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    pattern-regex: dop_v1_[a-f0-9]{64}

  - id: mcp-ts-vercel-token
    message: >
      Vercel access token detected. Tokens must not be hardcoded — use
      environment variables or a secrets manager.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded Vercel access token
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    pattern-regex: vercel_[a-zA-Z0-9]{20,}

  - id: mcp-ts-pem-private-key
    message: >
      PEM-encoded private key block detected in source code. Private keys must
      never be embedded in source — use a key management service or load from
      a secrets manager at runtime.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: PEM private key block embedded in TypeScript MCP server
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
    pattern-regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'

  - id: mcp-ts-vault-token
    message: >
      HashiCorp Vault token detected. Vault tokens must not be hardcoded —
      use AppRole, Kubernetes auth, or another Vault auth method to obtain
      short-lived tokens at runtime.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded HashiCorp Vault token (service or batch)
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
    pattern-regex: hv[sb]\.[A-Za-z0-9_-]{90,}

  - id: mcp-ts-anthropic-api-key
    message: >
      Anthropic API key detected. API keys must not be hardcoded — use
      environment variables (process.env.ANTHROPIC_API_KEY) or a secrets
      manager instead.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded Anthropic API key
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    pattern-regex: sk-ant-[a-zA-Z0-9_-]{20,}

  - id: mcp-ts-github-fine-grained-pat
    message: >
      GitHub fine-grained personal access token detected. PATs must not be
      hardcoded — use environment variables or a secrets manager.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: credentials
      cwe: CWE-798
      owasp: A07:2021
      owasp-mcp-top-10:
        - MCP01
      description: Hardcoded GitHub fine-grained personal access token
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    pattern-regex: github_pat_[A-Za-z0-9_]{82}
