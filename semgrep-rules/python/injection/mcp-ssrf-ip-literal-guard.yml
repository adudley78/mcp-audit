rules:
  - id: mcp-ssrf-ip-literal-only-guard
    message: >
      SSRF guard checks the URL's host with ipaddress.ip_address() but never
      resolves hostnames. A hostname is not an IP literal, so ip_address()
      raises ValueError and the handler lets it through: a name that points
      at 127.0.0.1, 10.x.x.x or 169.254.169.254 (or an attacker's DNS record
      that does) passes the check. This is the shape of the Wazuh MCP server
      advisory GHSA-pw2j-pj4h-f5vg. Resolve the hostname (socket.getaddrinfo),
      reject it if any resolved address is private, loopback, link-local or
      reserved, and connect to the address you checked rather than resolving
      again, or DNS rebinding reopens the hole.
    severity: WARNING
    languages: [python]
    metadata:
      category: injection
      cwe: CWE-918
      owasp: A10:2021
      owasp-mcp-top-10:
        - MCP05
      references:
        - https://github.com/INFOKOM-KI/Wazuh-MCP-Server/security/advisories/GHSA-pw2j-pj4h-f5vg
        - https://thenextweb.com/news/mcp-flaw-ssrf-google-jpmorgan-dinum-protocol-pivoting
      description: SSRF guard that only blocks IP literals — hostnames bypass it
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      fp-guidance: >
        Fires when ipaddress.ip_address() sits in a try whose ValueError
        handler does not raise, inside a function that checks is_private /
        is_loopback / is_link_local / is_reserved / is_global and never
        calls socket.getaddrinfo, gethostbyname or loop.getaddrinfo. If the
        handler's return value makes the caller reject the URL (hostnames are
        refused outright), the guard is fail-closed: suppress with
        # nosemgrep: mcp-ssrf-ip-literal-only-guard.
    patterns:
      - pattern: ipaddress.ip_address($HOST)
      - pattern-either:
          - pattern-inside: |
              try:
                  ...
              except ValueError:
                  ...
          - pattern-inside: |
              try:
                  ...
              except ValueError as $E:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., ValueError, ...):
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., ValueError, ...) as $E:
                  ...
      - pattern-either:
          - pattern-inside: |
              def $F(...):
                  ...
                  <... $IP.is_private ...>
                  ...
          - pattern-inside: |
              def $F(...):
                  ...
                  <... $IP.is_loopback ...>
                  ...
          - pattern-inside: |
              def $F(...):
                  ...
                  <... $IP.is_link_local ...>
                  ...
          - pattern-inside: |
              def $F(...):
                  ...
                  <... $IP.is_reserved ...>
                  ...
          - pattern-inside: |
              def $F(...):
                  ...
                  <... $IP.is_global ...>
                  ...
      - pattern-not-inside: |
          try:
              ...
          except ValueError:
              ...
              raise ...
      - pattern-not-inside: |
          try:
              ...
          except ValueError as $E:
              ...
              raise ...
      - pattern-not-inside: |
          try:
              ...
          except (..., ValueError, ...):
              ...
              raise ...
      - pattern-not-inside: |
          try:
              ...
          except (..., ValueError, ...) as $E:
              ...
              raise ...
      - pattern-not-inside: |
          try:
              ...
          except ValueError:
              ...
              raise $EXC from $CAUSE
      - pattern-not-inside: |
          try:
              ...
          except ValueError as $E:
              ...
              raise $EXC from $CAUSE
      - pattern-not-inside: |
          try:
              ...
          except (..., ValueError, ...):
              ...
              raise $EXC from $CAUSE
      - pattern-not-inside: |
          try:
              ...
          except (..., ValueError, ...) as $E:
              ...
              raise $EXC from $CAUSE
      - pattern-not-inside: |
          def $F(...):
              ...
              <... socket.getaddrinfo(...) ...>
              ...
      - pattern-not-inside: |
          def $F(...):
              ...
              <... socket.gethostbyname(...) ...>
              ...
      - pattern-not-inside: |
          def $F(...):
              ...
              <... socket.gethostbyname_ex(...) ...>
              ...
      - pattern-not-inside: |
          def $F(...):
              ...
              <... $LOOP.getaddrinfo(...) ...>
              ...
